name: Advisor replay

# Replays 17Lands Premier Draft picks through the advisor before and after a
# change, and reports how often each agrees with drafters and how that relates
# to their wins. See Tools/AdvisorReplay/README.md.
#
# Runs on pull requests that change the advisor or this harness, and by hand
# (Actions > Advisor replay > Run workflow) to compare a branch with any ref.

on:
  push:
    branches: [replay-bomb-format]
  pull_request:
    paths:
      - "src/advisor/**"
      - "Tools/AdvisorReplay/**"
      - ".github/workflows/advisor-replay.yml"
  workflow_dispatch:
    inputs:
      base:
        description: Branch, tag or commit to compare the selected branch with
        default: main
      sets:
        description: 'JSON list of set codes, e.g. ["FRA", "TDM"] (empty: all ten)'
        default: ""
      drafts:
        description: Drafts per set
        default: "3000"
      salt:
        description: Any text; changes which drafts are sampled
        default: ""

permissions:
  contents: read

concurrency:
  group: advisor-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BASE: ${{ github.event.pull_request.base.sha || inputs.base || '2c376385561daf3276c199657aad0bf7dae5c5f1' }}
  HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
  DRAFTS: ${{ inputs.drafts || '3000' }}
  SALT: ${{ inputs.salt || 'bomb-format' }}
  # name:CONST=VALUE,CONST=VALUE ... (space-separated); each replays this branch with
  # DraftAdvisor constants overridden and is reported against the base.
  VARIANTS: >-
    p10:
    p5:POWER_PER_Z=5
    p15:POWER_PER_Z=15
    p20:POWER_PER_Z=20
    p10-min0:POWER_MIN_Z=0
    p10-min1:POWER_MIN_Z=1.0

jobs:
  replay:
    name: Replay ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(inputs.sets || '["DFT", "FDN", "FIN", "FRA", "HOB", "MSH", "SOS", "TDM", "TLA", "TMT"]') }}
    env:
      SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out the base to compare with
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          path: base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Download the draft dump and the app's dataset
        run: |
          curl -fsSL --retry 3 -o dump.csv.gz \
            "https://17lands-public.s3.amazonaws.com/analysis_data/draft_data/draft_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o dataset.json.gz \
            "https://unrealities.github.io/MTGA_Draft_17Lands/${SET}_PremierDraft_All_Data.json.gz"
      - name: Sample drafts
        run: poetry run python Tools/AdvisorReplay/sample.py --dump dump.csv.gz --drafts "$DRAFTS" --salt "$SALT" --out drafts.json.gz
      - name: Replay the base
        run: |
          mkdir -p results/base
          poetry run python Tools/AdvisorReplay/replay.py --src base --drafts drafts.json.gz --dataset dataset.json.gz --set "$SET" --label base --out "results/base/$SET.base.json"
      - name: Replay the variants
        run: |
          for v in $VARIANTS; do
            name="${v%%:*}"; consts="${v#*:}"
            mkdir -p "results/$name"
            CONSTS="$consts" poetry run python Tools/AdvisorReplay/variant.py --src . --drafts drafts.json.gz --dataset dataset.json.gz --set "$SET" --label head --out "results/$name/$SET.head.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.set }}
          path: results/

  report:
    needs: replay
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: replay-*
          path: results
          merge-multiple: true
      - name: Report
        run: |
          {
            echo "# Advisor replay: base \`${BASE::7}\`, head \`${HEAD::7}\`"
            for v in $VARIANTS; do
              name="${v%%:*}"
              echo; echo "# Variant $name (\`${v#*:}\`)"; echo
              poetry run python Tools/AdvisorReplay/report.py results/base/*.json "results/$name"/*.json
            done
          } | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: replay-report
          path: report.md
