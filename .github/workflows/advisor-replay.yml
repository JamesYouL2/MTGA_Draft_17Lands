name: Advisor replay

# Replays 17Lands Premier Draft picks through the advisor and reports how often
# it agrees with the drafter (see Tools/AdvisorReplay). Manual only: a full run
# downloads ~1.5 GB of dumps and takes ~20 minutes across the matrix.

on:
  workflow_dispatch:
    inputs:
      sets:
        description: Comma-separated set codes
        default: FRA,HOB,MSH,SOS,TMT,TLA,FIN,TDM,DFT,FDN
      shards:
        description: Jobs per set
        default: "4"
      drafts:
        description: Drafts per job
        default: "100"
      variants:
        description: Comma-separated engine variants
        default: baseline,arch-overall-pick
      blends:
        description: Comma-separated ATA blends scored on top of each variant
        default: ""

permissions:
  contents: read

# Fallbacks for runs that aren't dispatched with inputs.
env:
  SETS: ${{ inputs.sets || 'FRA,HOB,MSH,SOS,TMT,TLA,FIN,TDM,DFT,FDN' }}
  SHARDS: ${{ inputs.shards || '4' }}
  DRAFTS: ${{ inputs.drafts || '100' }}
  VARIANTS: ${{ inputs.variants || 'baseline,arch-overall-pick' }}
  BLENDS: ${{ inputs.blends || '' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          sets = [s.strip().upper() for s in os.environ["SETS"].split(",") if s.strip()]
          shards = int(os.environ["SHARDS"])
          include = [{"set": s, "shard": i} for s in sets for i in range(shards)]
          print("matrix=" + json.dumps({"include": include}))
          PY

  replay:
    name: ${{ matrix.set }} / ${{ matrix.shard }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install poetry==2.4.1
      - name: Install locked dependencies
        run: poetry install --no-interaction
      - name: Download draft dump and dataset
        env:
          SET: ${{ matrix.set }}
        run: |
          mkdir -p "$RUNNER_TEMP/replay"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/replay/draft_data_public.$SET.PremierDraft.csv.gz" \
            "https://17lands-public.s3.amazonaws.com/analysis_data/draft_data/draft_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/replay/${SET}_PremierDraft_All_Data.json.gz" \
            "https://unrealities.github.io/MTGA_Draft_17Lands/${SET}_PremierDraft_All_Data.json.gz"
      - name: Replay
        env:
          SET: ${{ matrix.set }}
          SHARD: ${{ matrix.shard }}
        run: |
          variant_args=()
          IFS=',' read -ra names <<< "$VARIANTS"
          for v in "${names[@]}"; do variant_args+=(--variant "${v// /}"); done
          IFS=',' read -ra names <<< "$BLENDS"
          for b in "${names[@]}"; do if [ -n "${b// /}" ]; then variant_args+=(--blend "${b// /}"); fi; done
          poetry run python Tools/AdvisorReplay/advisor_replay.py run \
            --dump "$RUNNER_TEMP/replay/draft_data_public.$SET.PremierDraft.csv.gz" \
            --dataset "$RUNNER_TEMP/replay/${SET}_PremierDraft_All_Data.json.gz" \
            --drafts "$DRAFTS" --shard "$SHARD" --num-shards "$SHARDS" \
            "${variant_args[@]}" --out "results/$SET-$SHARD.json"
      - uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.set }}-${{ matrix.shard }}
          path: results/

  summarize:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: python -m pip install poetry==2.4.1
      - name: Install locked dependencies
        run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: replay-*
          path: results
          merge-multiple: true
      - name: Summarize
        run: |
          poetry run python Tools/AdvisorReplay/advisor_replay.py summarize --per-set results/*.json \
            | tee summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: replay-summary
          path: |
            summary.md
            results/
