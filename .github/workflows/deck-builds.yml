name: Deck builds

# Runs the real deck builder on real pools under versions of it, with win rates
# that leave each pool's own games out, and reports how the suggestions change
# and how they did. Also runs the Custom Deck window's Auto lands and Auto
# optimize on the played decks. See
# experiments/2026-11-13-builder-leftovers/PROTOCOL.md.
#
# Run by hand: Actions > Deck builds > Run workflow.

on:
  workflow_dispatch:
    inputs:
      sets:
        description: 'JSON list of 17Lands set codes, e.g. ["FRA", "TDM"] (empty: every set with game data and ratings, without the cube)'
        default: ""
      decks:
        description: Decks per set
        default: "50000"
      salt:
        description: Any text; changes which decks are sampled
        default: ""
      button_decks:
        description: Sampled decks per set that go through the two buttons
        default: "5000"

permissions:
  contents: read

jobs:
  builds:
    name: Builds ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(inputs.sets || '["BLB", "DFT", "DMU", "DSK", "EOE", "FDN", "FIN", "FRA", "HOB", "LTR", "MH3", "MSH", "NEO", "OTJ", "PIO", "SOS", "TDM", "TLA", "TMT"]') }}
    env:
      SET: ${{ matrix.set }}
      DECKS: ${{ inputs.decks || '50000' }}
      SALT: ${{ inputs.salt }}
      BUTTON_DECKS: ${{ inputs.button_decks || '5000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Download the game data and the app's dataset
        run: |
          curl -fsSL --retry 3 -o games.csv.gz \
            "https://17lands-public.s3.amazonaws.com/analysis_data/game_data/game_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o dataset.json.gz \
            "https://unrealities.github.io/MTGA_Draft_17Lands/${SET}_PremierDraft_All_Data.json.gz"
      - name: Sample decks
        run: poetry run python Tools/DeckScoreFit/decks.py --games games.csv.gz --decks "$DECKS" --salt "$SALT" --out decks.json.gz
      - name: Read out-of-sample win rates
        run: poetry run python Tools/DeckScoreFit/games.py --games games.csv.gz --decks decks.json.gz --out games.json.gz
      - name: Run the deck builder
        run: poetry run python Tools/DeckScoreFit/builds.py --src . --decks decks.json.gz --games games.json.gz --dataset dataset.json.gz --set "$SET" --out "results/$SET.json.gz"
      - name: Run the two buttons
        run: poetry run python Tools/DeckScoreFit/buttons.py --src . --decks decks.json.gz --games games.json.gz --dataset dataset.json.gz --set "$SET" --first "$BUTTON_DECKS" --out "buttons/$SET.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: builds-${{ matrix.set }}
          path: |
            results/
            buttons/
          compression-level: 0

  report:
    needs: builds
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: builds-*
          path: .
          merge-multiple: true
      - name: Whether Tempo and safe-deck promotion earn their place
        shell: bash  # with pipefail, so a failed report fails the step
        run: |
          {
            echo "# Deck variants at \`${GITHUB_SHA::7}\`"
            echo
            poetry run python Tools/DeckScoreFit/deck_variants.py results/*.json.gz --json deck_variants.json
          } | tee deck_variants.md >> "$GITHUB_STEP_SUMMARY"
      - name: Whether the two buttons earn their place
        shell: bash
        run: |
          {
            echo "# Auto lands and Auto optimize at \`${GITHUB_SHA::7}\`"
            echo
            poetry run python Tools/DeckScoreFit/buttons_report.py buttons/*.json.gz --json buttons.json
          } | tee buttons.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: builder-leftovers
          path: |
            deck_variants.md
            deck_variants.json
            buttons.md
            buttons.json
