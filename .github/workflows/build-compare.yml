name: Build compare

# Throwaway: the deck builder's top suggestion for real pools under the old
# deck scorer, the new one, and the new one with a fixing penalty.

on:
  push:
    branches: [exp-build-compare]
  workflow_dispatch:

permissions:
  contents: read

env:
  DRAFTS: "300"

jobs:
  compare:
    name: Compare ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        set: ["DFT", "FDN", "FIN", "FRA", "HOB", "MSH", "SOS", "TDM", "TLA", "TMT"]
    env:
      SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Download the game data and the app's dataset
        run: |
          curl -fsSL --retry 3 -o games.csv.gz \
            "https://17lands-public.s3.amazonaws.com/analysis_data/game_data/game_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o dataset.json.gz \
            "https://unrealities.github.io/MTGA_Draft_17Lands/${SET}_PremierDraft_All_Data.json.gz"
      - name: Compare
        run: |
          mkdir -p results
          poetry run python Tools/BuildCompare/compare.py --src . \
            --old-scorer Tools/BuildCompare/old_deck_scorer.py \
            --games games.csv.gz --dataset dataset.json.gz --set "$SET" \
            --drafts "$DRAFTS" --out "results/$SET.json"
      - uses: actions/upload-artifact@v4
        with:
          name: compare-${{ matrix.set }}
          path: results/

  summarize:
    needs: compare
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: compare-*
          path: results
          merge-multiple: true
      - name: Summarize
        run: |
          python Tools/BuildCompare/summarize.py --examples examples.md results/*.json \
            | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: build-compare
          path: |
            report.md
            examples.md
            results/
