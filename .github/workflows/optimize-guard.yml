name: Optimize guard

# Auto-Optimize three ways (today's main button, the plain Power Up swap, and the
# swap with a guard) on real played decks. See
# experiments/2026-11-21-optimize-guard/PROTOCOL.md.
#
# Runs on a push to run/optimize-guard, or by hand.

on:
  push:
    branches: [run/optimize-guard]
  workflow_dispatch:

permissions:
  contents: read

env:
  DECKS: "100000"
  BUTTON_DECKS: "20000"
  SALT: guard-2026-11-21
  EXCLUDE: three:100000:20000

jobs:
  heads:
    name: Heads ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      matrix:
        set: ["BLB", "DFT", "DMU", "DSK", "EOE", "FDN", "FIN", "FRA", "HOB", "LTR", "MH3", "MSH", "NEO", "OTJ", "PIO", "SOS", "TDM", "TLA", "TMT"]
    env:
      SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Download the game data and the app's dataset
        run: |
          curl -fsSL --retry 3 -o games.csv.gz \
            "https://17lands-public.s3.amazonaws.com/analysis_data/game_data/game_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o dataset.json.gz \
            "https://unrealities.github.io/MTGA_Draft_17Lands/${SET}_PremierDraft_All_Data.json.gz"
      - name: Sample decks
        run: poetry run python Tools/DeckScoreFit/decks.py --games games.csv.gz --decks "$DECKS" --salt "$SALT" --exclude "$EXCLUDE" --out decks.json.gz
      - name: Read out-of-sample win rates
        run: poetry run python Tools/DeckScoreFit/games.py --games games.csv.gz --decks decks.json.gz --out games.json.gz
      - name: Run the three heads
        run: poetry run python experiments/2026-11-21-optimize-guard/heads.py --src . --decks decks.json.gz --games games.json.gz --dataset dataset.json.gz --set "$SET" --first "$BUTTON_DECKS" --out "heads/$SET.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: heads-${{ matrix.set }}
          path: heads/
          compression-level: 0

  report:
    needs: heads
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: heads-*
          path: heads
          merge-multiple: true
      - name: Report
        shell: bash
        run: |
          {
            echo "# Auto-Optimize guard at \`${GITHUB_SHA::7}\`"
            echo
            python experiments/2026-11-21-optimize-guard/report.py heads/*.json.gz --json guard.json
          } | tee guard.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: optimize-guard
          path: |
            guard.md
            guard.json
