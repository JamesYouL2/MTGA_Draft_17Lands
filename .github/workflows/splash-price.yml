name: Splash price

# Fits separate deck score weights for a splash and for three main colors.
# See experiments/2026-11-16-splash-price/PROTOCOL.md.
#
# Run by hand: Actions > Splash price > Run workflow, or push to run/splash-price.

on:
  push:
    branches: [run/splash-price]
  workflow_dispatch:
    inputs:
      sets:
        description: 'JSON list of set codes (empty: every set with game data and ratings)'
        default: ""
      decks:
        description: Decks per set
        default: "50000"
      salt:
        description: Any text; changes which decks are sampled
        default: "splash-price-2026-11-16"

permissions:
  contents: read

jobs:
  features:
    uses: ./.github/workflows/deck-score-features.yml
    with:
      sets: ${{ inputs.sets }}
      decks: ${{ inputs.decks || '50000' }}
      salt: ${{ inputs.salt || 'splash-price-2026-11-16' }}

  colors:
    needs: features
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: features-*
          path: results
          merge-multiple: true
      - name: Fit
        shell: bash  # with pipefail, so a failed fit fails the step
        run: |
          {
            echo "# Splash price at \`${GITHUB_SHA::7}\`"
            echo
            poetry run python experiments/2026-11-16-splash-price/colors.py results/*.json
          } | tee colors.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: splash-price-report
          path: colors.md
