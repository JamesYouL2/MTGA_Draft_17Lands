name: Advisor heads

# Replays 17Lands Premier Draft picks through the advisor and through a patched
# copy of it for each head, on ratings without the replayed drafts' games. All
# heads share one job per set and sample, so they're compared on the same drafts
# and the same ratings. See experiments/2026-11-15-flag-snc-ktk/PROTOCOL.md.
#
# Each salt is its own sample of drafts and its own held-out ratings, so heads.py
# combines the salts' estimates with the spread between them in the SE (see
# experiments/2026-11-17-measure-salts). The default is 8 salts of
# 1000 drafts, the study's best use of the job time. Give `salts` as a
# count for fresh salts named after the run (r<run number>s1, r<run number>s2, ...)
# or a JSON list to reuse named ones; set `salt_prefix` to repeat a numbered run.
#
# Run by hand: Actions > Advisor heads > Run workflow.

on:
  workflow_dispatch:
    inputs:
      patches:
        description: Patches to src/, one head each
        default: "experiments/2026-11-16-proposed-together/heads/*.patch"
      sets:
        description: 'JSON list of set codes, e.g. ["FRA", "TDM"] (empty: all ten)'
        default: ""
      salts:
        description: 'Salts: a count (fresh salts for this run) or a JSON list of texts, e.g. ["a", "b"]'
        default: "8"
      salt_prefix:
        description: 'Prefix for counted salts (default: r<run number>s); no "-"'
        default: ""
      drafts:
        description: Drafts per set and salt
        default: "1000"
      extra:
        description: A script to run on the results after the reports (optional)
        default: ""
      ratings_salts:
        description: 'JSON list; a non-empty entry also holds out a second sample of drafts from the ratings, replaying the same drafts (diagnostic)'
        default: '[""]'
      simulate:
        description: 'Also let each copy draft the packs itself and score its deck (about twice the replay time; experiments/2026-11-21-simulated-draft)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      salts: ${{ steps.salts.outputs.salts }}
    steps:
      - id: salts
        env:
          SALTS: ${{ inputs.salts || '8' }}
          PREFIX: ${{ inputs.salt_prefix || format('r{0}s', github.run_number) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          spec, prefix = os.environ["SALTS"].strip(), os.environ["PREFIX"]
          salts = [f"{prefix}{i}" for i in range(1, int(spec) + 1)] if spec.isdigit() else json.loads(spec)
          # heads.py reads the salt back from the artifact name after its last "-".
          bad = [x for x in salts if "-" in x or "+" in x]
          assert not bad and len(set(salts)) == len(salts), f"salts must be distinct, without - or +: {salts}"
          print("salts=" + json.dumps(salts))
          PY
          cat "$GITHUB_OUTPUT"

  replay:
    name: Replay ${{ matrix.set }} ${{ matrix.salt }} ${{ matrix.rsalt }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(inputs.sets || '["DFT", "FDN", "FIN", "FRA", "HOB", "MSH", "SOS", "TDM", "TLA", "TMT"]') }}
        salt: ${{ fromJSON(needs.plan.outputs.salts) }}
        rsalt: ${{ fromJSON(inputs.ratings_salts || '[""]') }}
    env:
      SET: ${{ matrix.set }}
      SALT: ${{ matrix.salt }}
      RSALT: ${{ matrix.rsalt }}
      DRAFTS: ${{ inputs.drafts || '1000' }}
      PATCHES: ${{ inputs.patches || 'experiments/2026-11-16-proposed-together/heads/*.patch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Download the dumps and the app's dataset
        run: |
          curl -fsSL --retry 3 -o dump.csv.gz \
            "https://17lands-public.s3.amazonaws.com/analysis_data/draft_data/draft_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o games.csv.gz \
            "https://17lands-public.s3.amazonaws.com/analysis_data/game_data/game_data_public.$SET.PremierDraft.csv.gz"
          # Sets the daily ETL never covered have a dataset in the experiment's folder.
          if [ -f "experiments/2026-11-15-flag-snc-ktk/datasets/$SET.json.gz" ]; then
            cp "experiments/2026-11-15-flag-snc-ktk/datasets/$SET.json.gz" dataset.json.gz
          else
            curl -fsSL --retry 3 -o dataset.json.gz \
              "https://unrealities.github.io/MTGA_Draft_17Lands/${SET}_PremierDraft_All_Data.json.gz"
          fi
      - name: Sample drafts and hold them out of the ratings
        shell: bash
        run: |
          poetry run python Tools/AdvisorReplay/sample.py --dump dump.csv.gz --drafts "$DRAFTS" --salt "$SALT" --out drafts.json.gz
          also=()
          if [ -n "$RSALT" ]; then
            poetry run python Tools/AdvisorReplay/sample.py --dump dump.csv.gz --drafts "$DRAFTS" --salt "$RSALT" --out also.json.gz
            also=(--also also.json.gz)
          fi
          poetry run python Tools/AdvisorReplay/holdout.py --games games.csv.gz --drafts drafts.json.gz --dataset dataset.json.gz --rebuilt rebuilt.json.gz --heldout heldout.json.gz "${also[@]}"
          rm dump.csv.gz games.csv.gz rebuilt.json.gz
      - name: Copy the app for each head
        shell: bash
        run: |
          for patch in $PATCHES; do
            head=$(basename "$patch" .patch)
            mkdir -p "copies/$head"
            cp -r src "copies/$head/src"
            git apply --directory="copies/$head" "$patch"
            echo "$head" >> heads.txt
          done
      - name: Replay the base and the heads
        shell: bash
        env:
          SIMULATE: ${{ inputs.simulate && '--simulate' || '' }}
        run: |
          replay() {
            if [ "$1" = base ]; then src=.; else src="copies/$1"; fi
            poetry run python Tools/AdvisorReplay/replay.py --src "$src" --drafts drafts.json.gz \
              --dataset heldout.json.gz --set "$SET" --label "$1" --out "results/$1.json" $SIMULATE
          }
          export -f replay
          { echo base; cat heads.txt; } | xargs -P 4 -I{} bash -c 'replay {}'
      - uses: actions/upload-artifact@v4
        with:
          name: heads-${{ matrix.set }}-${{ matrix.salt || 'none' }}${{ matrix.rsalt && format('+{0}', matrix.rsalt) || '' }}
          path: results/

  report:
    needs: replay
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: heads-*
          path: results
      - name: Extra report
        if: ${{ inputs.extra != '' }}
        shell: bash
        env:
          EXTRA: ${{ inputs.extra }}
        run: |
          {
            echo
            poetry run python "$EXTRA" results
          } | tee extra.md >> "$GITHUB_STEP_SUMMARY"
      - name: Report
        if: ${{ !cancelled() }}
        shell: bash  # with pipefail, so a failed report fails the step
        run: |
          {
            echo "# Advisor heads at \`${GITHUB_SHA::7}\`"
            echo
            poetry run python experiments/2026-11-08-pick-multipliers/heads.py results --json heads.json
          } | tee heads.md >> "$GITHUB_STEP_SUMMARY"
      - name: By set
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo
            echo "# By set"
            echo
            poetry run python experiments/2026-11-15-off-color-share/by_set.py results --json by_set.json
          } | tee by_set.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: heads-report
          path: |
            heads.md
            heads.json
            by_set.md
            by_set.json
            extra.md
            extra.json
