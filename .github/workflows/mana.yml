name: Mana luck

# Tests on 17Lands Premier Draft game data whether the deck builder's
# mana-luck penalties (color screw, screw, flood) match what those events
# cost registered decks.
# See Tools/DeckScoreFit/README.md.
#
# Run by hand: Actions > Mana luck > Run workflow.

on:
  workflow_dispatch:
    inputs:
      sets:
        description: 'JSON list of 17Lands set codes, e.g. ["FRA", "TDM"] (empty: every set with game data and ratings)'
        default: ""
      decks:
        description: Decks per set
        default: "50000"
      salt:
        description: Any text; changes which decks are sampled
        default: ""

permissions:
  contents: read

env:
  DECKS: ${{ inputs.decks || '50000' }}
  SALT: ${{ inputs.salt }}

jobs:
  data:
    name: Data ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # The sets in rule-targets.yml.
        set: ${{ fromJSON(inputs.sets || '["BLB", "Cube_-_Powered", "DFT", "DMU", "DSK", "EOE", "FDN", "FIN", "FRA", "HOB", "LTR", "MH3", "MSH", "NEO", "OTJ", "PIO", "SOS", "TDM", "TLA", "TMT"]') }}
    env:
      SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Download the game data and the app's dataset
        run: |
          # 17Lands names the cube Cube_-_Powered; the app, "Cube - Powered".
          NAME="${SET//_-_/%20-%20}"
          curl -fsSL --retry 3 -o games.csv.gz \
            "https://17lands-public.s3.amazonaws.com/analysis_data/game_data/game_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o dataset.json.gz \
            "https://unrealities.github.io/MTGA_Draft_17Lands/${NAME}_PremierDraft_All_Data.json.gz"
      - name: Sample decks
        run: poetry run python Tools/DeckScoreFit/decks.py --games games.csv.gz --decks "$DECKS" --salt "$SALT" --out decks.json.gz
      - name: Compute features
        run: poetry run python Tools/DeckScoreFit/features.py --src . --decks decks.json.gz --dataset dataset.json.gz --set "$SET" --out "results/features/$SET.json"
      - name: Read hands
        run: poetry run python Tools/DeckScoreFit/games.py --games games.csv.gz --decks decks.json.gz --out games.json.gz
      - name: Simulate mana
        run: poetry run python Tools/DeckScoreFit/hands.py --src . --decks decks.json.gz --games games.json.gz --dataset dataset.json.gz --set "$SET" --out "results/hands/$SET.json"
      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.set }}
          path: results/

  analysis:
    needs: data
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          path: results
          merge-multiple: true
      - name: Mana luck
        shell: bash  # with pipefail, so a failed fit fails the step
        run: |
          {
            echo "# Mana luck at \`${GITHUB_SHA::7}\`"
            echo
            poetry run python Tools/DeckScoreFit/mana.py --features results/features/*.json --hands results/hands/*.json --json mana.json
          } | tee mana.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mana
          path: |
            mana.md
            mana.json
