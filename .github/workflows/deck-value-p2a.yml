# experiments/2026-11-22-deck-value: Phase 2a (PHASE2A.md), within-deck draw
# effects. Runs on a push that changes this file on exp/deck-value.
# The first run (45163773464) failed on the older files' layout (17 meta
# columns, counts written as 0.0) and was cancelled; this run redoes all sets.
name: Deck value Phase 2a

on:
  push:
    branches: [exp/deck-value]
    paths: [.github/workflows/deck-value-p2a.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fit:
    name: Fit ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        set: ["BLB", "Cube_-_Powered", "DFT", "DMU", "DSK", "EOE", "FDN", "FIN", "FRA", "HOB",
              "LTR", "MH3", "MSH", "NEO", "OTJ", "PIO", "SOS", "TDM", "TLA", "TMT"]
    env:
      SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Download the game data and the app's dataset
        run: |
          NAME="${SET//_-_/%20-%20}"
          curl -fsSL --retry 3 -o games.csv.gz \
            "https://17lands-public.s3.amazonaws.com/analysis_data/game_data/game_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o dataset.json.gz \
            "https://unrealities.github.io/MTGA_Draft_17Lands/${NAME}_PremierDraft_All_Data.json.gz"
          ls -la games.csv.gz dataset.json.gz
      - name: Fit
        run: |
          mkdir -p out
          poetry run python experiments/2026-11-22-deck-value/p2a_fit.py --src . --set "$SET" \
            --games games.csv.gz --dataset dataset.json.gz --out "out/p2a-$SET.json"
      - uses: actions/upload-artifact@v4
        with:
          name: p2a-${{ matrix.set }}
          path: out/

  report:
    needs: [fit]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: p2a-*
          path: p2a
          merge-multiple: true
      - name: Report
        run: |
          mkdir -p report
          ls p2a
          cp p2a/*.json report/
          python experiments/2026-11-22-deck-value/p2a_report.py p2a/p2a-*.json \
            --e1 experiments/2026-11-22-deck-value/reports/e1.json --json report/p2a.json | tee report/p2a.md
      - uses: actions/upload-artifact@v4
        with:
          name: deck-value-p2a-report
          path: report/
