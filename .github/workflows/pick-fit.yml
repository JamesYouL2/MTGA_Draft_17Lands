name: Pick fit

# Fits the pick score's weights to strong 17Lands drafters' Premier Draft picks
# and reports how well the fitted and current weights pick on sets the fit
# didn't see. See Tools/PickFit/README.md.
#
# Run by hand: Actions > Pick fit > Run workflow.

on:
  push:
    branches: [exp-three-color]
  workflow_dispatch:
    inputs:
      sets:
        description: 'JSON list of set codes, e.g. ["FRA", "TDM"] (empty: all ten)'
        default: ""
      drafts:
        description: Strong drafters' drafts per set
        default: "4000"
      salt:
        description: Any text; changes which drafts are sampled
        default: ""

permissions:
  contents: read

env:
  DRAFTS: ${{ inputs.drafts || '2500' }}
  SALT: ${{ inputs.salt }}

jobs:
  features:
    name: Features ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        set: ${{ fromJSON(inputs.sets || '["DMU", "NEO", "VOW", "MID", "STX", "LTR", "OTJ", "BLB", "DSK", "EOE", "DFT", "FDN", "TDM", "FIN", "TLA", "FRA", "HOB", "MSH", "SOS", "TMT"]') }}
    env:
      SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Download the draft data and the app's dataset
        run: |
          curl -fsSL --retry 3 -o drafts.csv.gz \
            "https://17lands-public.s3.amazonaws.com/analysis_data/draft_data/draft_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o dataset.json.gz \
            "https://unrealities.github.io/MTGA_Draft_17Lands/${SET}_PremierDraft_All_Data.json.gz"
      - name: Sample drafts
        run: poetry run python Tools/PickFit/drafts.py --dump drafts.csv.gz --drafts "$DRAFTS" --salt "$SALT" --out drafts.json.gz
      - name: Compute features
        run: poetry run python Tools/PickFit/features.py --src . --drafts drafts.json.gz --dataset dataset.json.gz --set "$SET" --out "results/$SET.json.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: features-${{ matrix.set }}
          path: results/

  fit:
    needs: features
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: features-*
          path: results
          merge-multiple: true
      - name: Fit
        shell: bash  # with pipefail, so a failed fit fails the step
        run: |
          {
            echo "# Three-color flag at \`${GITHUB_SHA::7}\`"
            echo
            poetry run python Tools/PickFit/flags.py --flags Tools/PickFit/flags.json results/*.json.gz
            echo
            echo "# Pick fit"
            echo
            poetry run python Tools/PickFit/fit.py results/*.json.gz
          } | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fit-report
          path: report.md
