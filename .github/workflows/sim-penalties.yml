name: Sim penalties

# Throwaway: fits the deck builder's Monte Carlo penalties (color screw, mana
# screw, flood risk) to which candidate build drafters chose.

on:
  push:
    branches: [exp-sim-penalties]
  workflow_dispatch:

permissions:
  contents: read

env:
  DRAFTS: "1500"

jobs:
  candidates:
    name: Candidates ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        set: ["DFT", "FDN", "FIN", "FRA", "HOB", "MSH", "SOS", "TDM", "TLA", "TMT"]
    env:
      SET: ${{ matrix.set }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Download the game data and the app's dataset
        run: |
          curl -fsSL --retry 3 -o games.csv.gz \
            "https://17lands-public.s3.amazonaws.com/analysis_data/game_data/game_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o dataset.json.gz \
            "https://unrealities.github.io/MTGA_Draft_17Lands/${SET}_PremierDraft_All_Data.json.gz"
      - name: Collect candidate builds
        run: |
          mkdir -p results
          poetry run python Tools/BuildCompare/candidates.py --src . \
            --games games.csv.gz --dataset dataset.json.gz --set "$SET" \
            --drafts "$DRAFTS" --out "results/$SET.json"
      - uses: actions/upload-artifact@v4
        with:
          name: candidates-${{ matrix.set }}
          path: results/

  fit:
    needs: candidates
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy
      - uses: actions/download-artifact@v4
        with:
          pattern: candidates-*
          path: results
          merge-multiple: true
      - name: Fit
        run: |
          python Tools/BuildCompare/fit_sim.py results/*.json \
            | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sim-penalties
          path: report.md
