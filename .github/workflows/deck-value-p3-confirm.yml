# experiments/2026-11-22-deck-value: Phase 3-lite confirmation (P3CONFIRM.md).
# Fresh drafts (salt p3c1, first 500 per set). The games outside the sampled
# drafts are split in two by draft: half A drives main, blend-1 and gihwr-only
# (picks, replay, builds); half B grades their simulated decks.
# Data from data.17landscapes.com, the host 17Lands' dataset list gives since the
# S3 bucket began refusing requests on 2026-11-23 (run 45257044301).
# Runs on a push that changes this file on exp/deck-value.
name: Deck value Phase 3-lite confirmation

on:
  push:
    branches: [exp/deck-value]
    paths: [.github/workflows/deck-value-p3-confirm.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    name: Confirm ${{ matrix.set }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        set: ["BLB", "DFT", "DMU", "DSK", "EOE", "FDN", "FIN", "FRA", "HOB", "KTK",
              "LTR", "MSH", "NEO", "OTJ", "SNC", "SOS", "TDM", "TLA", "TMT"]
    env:
      SET: ${{ matrix.set }}
      DRAFTS: "500"
      PARTS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - name: Sample fresh drafts and build the two rating halves
        run: |
          curl -fsSL --retry 3 -o dump.csv.gz \
            "https://data.17landscapes.com/analysis_data/draft_data/draft_data_public.$SET.PremierDraft.csv.gz"
          curl -fsSL --retry 3 -o games.csv.gz \
            "https://data.17landscapes.com/analysis_data/game_data/game_data_public.$SET.PremierDraft.csv.gz"
          if [ -f "experiments/2026-11-15-flag-snc-ktk/datasets/$SET.json.gz" ]; then
            cp "experiments/2026-11-15-flag-snc-ktk/datasets/$SET.json.gz" dataset.json.gz
          else
            curl -fsSL --retry 3 -o dataset.json.gz \
              "https://unrealities.github.io/MTGA_Draft_17Lands/${SET}_PremierDraft_All_Data.json.gz"
          fi
          poetry run python Tools/AdvisorReplay/sample.py --dump dump.csv.gz --drafts 3000 --salt p3c1 --out drafts.json.gz
          poetry run python experiments/2026-11-22-deck-value/fold_ratings.py --games games.csv.gz \
            --drafts drafts.json.gz --dataset dataset.json.gz --a ratings_a.json.gz --b ratings_b.json.gz \
            | tee -a "$GITHUB_STEP_SUMMARY"
          rm dump.csv.gz games.csv.gz
      - name: Copy the app for gihwr-only
        run: |
          mkdir -p copies/gihwr-only
          cp -r src copies/gihwr-only/src
          patch -p1 -d copies/gihwr-only < experiments/2026-11-21-simulated-draft/heads/gihwr-only.patch
      - name: Replay and simulate main, gihwr-only and blend-1 on half A, judged on half B
        shell: bash
        run: |
          task() {
            n=$(( (DRAFTS + PARTS - 1) / PARTS ))
            common="--drafts drafts.json.gz --dataset ratings_a.json.gz --judge ratings_b.json.gz --replay --set $SET"
            case "$1" in
              main) poetry run python experiments/2026-11-22-deck-value/p3_decomp.py --src . $common \
                      --heads main --limit "$DRAFTS" --out out/main ;;
              gihwr-only) poetry run python experiments/2026-11-22-deck-value/p3_decomp.py --src copies/gihwr-only $common \
                      --heads main --label gihwr-only --limit "$DRAFTS" --out out/gihwr-only ;;
              *) poetry run python experiments/2026-11-22-deck-value/p3_decomp.py --src . $common \
                      --heads blend-1 --first $(( $1 * n )) --limit "$n" --out "out/part$1" ;;
            esac
          }
          export -f task
          { echo main; echo gihwr-only; seq 0 $(( PARTS - 1 )); } | xargs -P "$PARTS" -I{} bash -c 'task {}'
      - uses: actions/upload-artifact@v4
        with:
          name: p3c-${{ matrix.set }}
          path: out/

  report:
    needs: sim
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: p3c-*
          path: results
      - name: Report
        run: |
          poetry run python experiments/2026-11-22-deck-value/p3c_report.py results --json p3confirm.json \
            | tee p3confirm.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: p3c-report
          path: |
            p3confirm.md
            p3confirm.json
