name: Weights by size

# Throwaway: do pick weights that change with the ratings' sample size beat
# one weight set? Strong drafters' picks from the format's early days are
# scored with the ratings the app would have had then (rebuilt from 17Lands
# game data by Tools/PickFit/early_ratings.py): picks on day N+1 use ratings
# from drafts in the first N days.

on:
  push:
    branches: [exp-weights-by-size]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  DRAFTS: "500"
  DAYS: "1 2 3 5 7 14"

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: features-*
          path: results
          merge-multiple: true
          run-id: 41087509068
          github-token: ${{ github.token }}
      - name: Fit
        shell: bash
        run: |
          {
            echo "# Pick weights by sample size at \`${GITHUB_SHA::7}\`"
            echo
            ARGS=()
            for N in $DAYS; do ARGS+=("day $N=results/day$N"); done
            poetry run python Tools/PickFit/fit_by_size.py "${ARGS[@]}" "whole format=results/full"
          } | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: by-size-report
          path: report.md
