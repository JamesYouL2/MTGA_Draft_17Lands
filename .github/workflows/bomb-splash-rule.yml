name: Bomb splash rule

# Tests the advisor's Enables Bomb Splash rule on 17Lands Premier Draft game data.
# See experiments/2026-11-08-bomb-splash-rule/PROTOCOL.md.
#
# Run by hand: Actions > Bomb splash rule > Run workflow.

on:
  push:
  workflow_dispatch:
    inputs:
      sets:
        description: 'JSON list of 17Lands set codes, e.g. ["FRA", "TDM"] (empty: every set with game data and ratings)'
        default: ""
      decks:
        description: Decks per set
        default: "50000"
      salt:
        description: Any text; changes which decks are sampled
        default: ""

permissions:
  contents: read

jobs:
  features:
    uses: ./.github/workflows/deck-score-features.yml
    with:
      sets: ${{ inputs.sets }}
      decks: ${{ inputs.decks || '50000' }}
      salt: ${{ inputs.salt }}

  splash:
    needs: features
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install poetry==2.4.1
      - run: poetry install --no-interaction
      - uses: actions/download-artifact@v4
        with:
          pattern: features-*
          path: results
          merge-multiple: true
      - name: Test the rule
        shell: bash  # with pipefail, so a failed fit fails the step
        run: |
          {
            echo "# Bomb splash rule at \`${GITHUB_SHA::7}\`"
            echo
            poetry run python Tools/DeckScoreFit/splash_rule.py results/*.json --json splash_rule.json
          } | tee splash_rule.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bomb-splash-rule
          path: |
            splash_rule.md
            splash_rule.json
